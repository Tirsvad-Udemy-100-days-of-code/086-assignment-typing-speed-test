[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "typing-speed-test"
version = "0.1.0"
description = "Desktop app that tests and trains your typing speed in words per minute."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gui: graphical test; run only inside the Docker harness (see README)",
]

[tool.coverage.run]
source = ["src/typing_speed_test"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["framework", ".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "ANN401"]
"docker/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests", "docker"]

[tool.importlinter]
root_package = "typing_speed_test"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward (ADR-0002)"
type = "layers"
layers = [
    "typing_speed_test.infrastructure",
    "typing_speed_test.presentation",
    "typing_speed_test.application",
    "typing_speed_test.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application use no window library"
type = "forbidden"
source_modules = ["typing_speed_test.domain", "typing_speed_test.application"]
forbidden_modules = ["tkinter"]
